version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agoda_postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=AgodaBookingDb
    ports:
      - "5435:5432" 
    volumes:
      - postgres_data_new:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: agoda_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data_new:  